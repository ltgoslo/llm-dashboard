# NorEval Instruct models (/instruct): display metadata, keyed by the
# model's name in the run (data/instruct/results/<name>.json). Same fields
# as models_setup.yaml. A model of the run without an entry here is shown
# under its run name (build_data.py warns); `huggingface_url` defaults to
# the checkpoint the run evaluated. A name ending in `-think` is the same
# checkpoint evaluated with thinking turned on: it reasons before it
# answers, and the judge sees only the answer. Sizes as on the other
# pages for the same models; parameter counts from Hugging Face otherwise.
#
# Display names, short: the family and version, the total parameter count
# (a mixture of experts: total-A active, 26B-A4B; Gemma's per-layer
# embedding models: total-E effective, 8B-E4B), and " Thinking" for a model
# that reasons before it answers (a `-think` run, NorMistral 11B Thinking;
# build_data.py warns about a name without a size or a `-think` run
# without it).

