# NorEval Instruct tasks (/instruct): generative NorEval v1.3 for
# instruction-tuned models, every response graded by an LLM judge.
#
# Display settings only: a task's category, chance level and its items and
# prompt variants come from the run (data/instruct/run.json). The keys are
# the run's task names. The names follow metrics_setup.yaml, so the task
# picker shows a Bokmål/Nynorsk pair or both directions of a translation
# pair as one row. The description says what the model is asked; how the
# judge grades it is the same for every task (the page's About section).

ask_gec_nob:
  pretty_name: "grammar correction"
  description: "Grammatical error correction based on ASK-GEC, texts written by learners of Norwegian: the model gets a sentence with errors and returns it corrected. The judge compares the correction with a reference correction; errors left in and changes beyond what a correction needs cost points."
  url: https://huggingface.co/datasets/ltg/ask-gec

noridiom_nob:
  pretty_name: "idiom completion"
  description: "Idiom completion based on the Norwegian idioms of Språkbanken: the model gets the beginning of an idiom and completes it. The judge checks the completion against the accepted ones."
  url: https://huggingface.co/datasets/Sprakbanken/Norwegian_idioms

noridiom_nno:
  pretty_name: "idiom completion"
  description: "Idiom completion based on the Norwegian idioms of Språkbanken: the model gets the beginning of an idiom and completes it. The judge checks the completion against the accepted ones."
  url: https://huggingface.co/datasets/Sprakbanken/Norwegian_idioms

slide_nob_nno_swe_dan:
  pretty_name: "Scandinavian LID"
  description: "Language identification based on SLIDE: the model names the language of a sentence, choosing among Bokmål, Nynorsk, Danish, Swedish and another language. Some sentences are correct in more than one of them."
  url: https://huggingface.co/datasets/ltg/slide

norbelebele_nob:
  pretty_name: "reading comprehension (belebele)"
  description: "Reading comprehension based on NorBelebele: a multiple-choice question about a passage."
  url: https://huggingface.co/datasets/ltg/norbelebele

norec_document_nob:
  pretty_name: "sentiment analysis (document)"
  description: "Sentiment analysis of whole reviews from NoReC: the model says whether a review is positive or negative."
  url: https://huggingface.co/datasets/ltg/norec_document

norec_sentence_nob:
  pretty_name: "sentiment analysis (sentence)"
  description: "Sentiment analysis of single sentences from NoReC reviews: the model says whether a sentence is positive or negative."
  url: https://huggingface.co/datasets/ltg/norec_sentence

noropenbookqa_nob:
  pretty_name: "reading comprehension (openbookqa)"
